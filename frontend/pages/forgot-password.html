<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Forgot Password — RxGuard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@600&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="../css/main.css"/>
  <link rel="stylesheet" href="../css/components.css"/>
  <style>
    body { display:flex; align-items:center; justify-content:center; min-height:100vh; background:var(--rx-bg); }
    .auth-panel-right { width:100%; max-width:420px; padding:1.5rem; }
    .auth-card { background:var(--rx-surface); border:1px solid var(--rx-border); border-radius:var(--radius-xl);
                 padding:2.5rem; box-shadow:var(--shadow-lg); }
    .auth-logo-mobile { display:flex; align-items:center; gap:10px; margin-bottom:2rem;
                         font-size:1.25rem; font-weight:700; color:var(--rx-blue); }
    .auth-logo-icon { width:38px;height:38px;background:var(--rx-blue);border-radius:10px;
                       display:flex;align-items:center;justify-content:center;color:#fff;font-size:.9rem;font-weight:800; }
    .auth-heading { font-size:1.5rem;font-weight:700;margin-bottom:.4rem; }
    .auth-subtext { font-size:.875rem;color:var(--rx-muted);margin-bottom:2rem; }
    .auth-footer { text-align:center;font-size:.8125rem;color:var(--rx-muted);margin-top:1.5rem; }
    .auth-footer a { color:var(--rx-blue);font-weight:500;text-decoration:none; }
    .auth-footer a:hover { text-decoration:underline; }
  </style>
</head>
<body>

<div class="auth-panel-right">
  <div class="auth-card">
    <div class="auth-logo-mobile"><div class="auth-logo-icon">Rx</div>RxGuard</div>

    <div id="formState">
      <h1 class="auth-heading">Forgot your password?</h1>
      <p class="auth-subtext">Enter your email address and we'll send you a link to reset it.</p>

      <form id="forgotForm" novalidate>
        <div class="form-group">
          <label class="form-label" for="email">Email address</label>
          <input class="form-control" type="email" id="email" name="email"
                 placeholder="you@example.com" autocomplete="email" required/>
        </div>

        <div id="formError" class="alert alert-danger" style="display:none;margin-bottom:1rem">
          <span>⛔</span><span id="formErrorMsg"></span>
        </div>

        <button type="submit" class="btn btn-primary btn-lg btn-block" id="submitBtn">
          Send Reset Link
        </button>
      </form>
    </div>

    <div id="doneState" style="display:none;text-align:center">
      <div style="font-size:2.5rem;margin-bottom:1rem">📬</div>
      <h1 class="auth-heading">Check your email</h1>
      <p class="auth-subtext">If an account exists for that address, a password reset link is on its way.</p>
    </div>

    <div class="auth-footer">
      <a href="login.html">← Back to sign in</a>
    </div>
  </div>
</div>

<div class="toast-container" id="toastContainer" aria-live="polite"></div>

<script src="../js/api.js"></script>
<script src="../js/app.js"></script>
<script>
'use strict';

document.getElementById('forgotForm').addEventListener('submit', async function (e) {
  e.preventDefault();
  hideError();

  const email = document.getElementById('email').value.trim();
  if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
    showError('Enter a valid email address');
    return;
  }

  App.FormHelper.setLoading('submitBtn', true);
  try {
    await RxGuard.Auth.forgotPassword(email);
  } catch (err) {
    // Still show the generic success state — we never reveal whether the
    // email exists. Only a network-level failure surfaces here.
  } finally {
    document.getElementById('formState').style.display = 'none';
    document.getElementById('doneState').style.display = 'block';
  }
});

function showError(msg) {
  document.getElementById('formError').style.display = 'flex';
  document.getElementById('formErrorMsg').textContent = msg;
}
function hideError() {
  document.getElementById('formError').style.display = 'none';
}
</script>
</body>
</html>
