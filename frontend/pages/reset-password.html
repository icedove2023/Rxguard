<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Reset Password — RxGuard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@600&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="../css/main.css"/>
  <link rel="stylesheet" href="../css/components.css"/>
  <style>
    body { display:flex; align-items:center; justify-content:center; min-height:100vh; background:var(--rx-bg); }
    .auth-panel-right { width:100%; max-width:420px; padding:1.5rem; }
    .auth-card { background:var(--rx-surface); border:1px solid var(--rx-border); border-radius:var(--radius-xl);
                 padding:2.5rem; box-shadow:var(--shadow-lg); }
    .auth-logo-mobile { display:flex; align-items:center; gap:10px; margin-bottom:2rem;
                         font-size:1.25rem; font-weight:700; color:var(--rx-blue); }
    .auth-logo-icon { width:38px;height:38px;background:var(--rx-blue);border-radius:10px;
                       display:flex;align-items:center;justify-content:center;color:#fff;font-size:.9rem;font-weight:800; }
    .auth-heading { font-size:1.5rem;font-weight:700;margin-bottom:.4rem; }
    .auth-subtext { font-size:.875rem;color:var(--rx-muted);margin-bottom:2rem; }
    .auth-footer { text-align:center;font-size:.8125rem;color:var(--rx-muted);margin-top:1.5rem; }
    .auth-footer a { color:var(--rx-blue);font-weight:500;text-decoration:none; }
    .input-with-action { position:relative; }
    .input-with-action .form-control { padding-right:44px; }
    .input-action-btn { position:absolute;right:12px;top:50%;transform:translateY(-50%);
                         background:none;border:none;cursor:pointer;color:var(--rx-muted);font-size:.875rem;padding:4px; }
  </style>
</head>
<body>

<div class="auth-panel-right">
  <div class="auth-card">
    <div class="auth-logo-mobile"><div class="auth-logo-icon">Rx</div>RxGuard</div>

    <div id="noTokenState" style="display:none;text-align:center">
      <div style="font-size:2.5rem;margin-bottom:1rem">⏳</div>
      <h1 class="auth-heading">Link expired</h1>
      <p class="auth-subtext">This reset session has expired or wasn't found. Please request a new link.</p>
      <a class="btn btn-primary btn-block" href="forgot-password.html">Request new link</a>
    </div>

    <div id="formState">
      <h1 class="auth-heading">Set a new password</h1>
      <p class="auth-subtext">Choose a strong password you haven't used before.</p>

      <form id="resetForm" novalidate>
        <div class="form-group">
          <label class="form-label" for="password">New password</label>
          <div class="input-with-action">
            <input class="form-control" type="password" id="password" name="password"
                   placeholder="••••••••" autocomplete="new-password" required/>
            <button type="button" class="input-action-btn" id="togglePwd" aria-label="Show password">👁</button>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="password_confirmation">Confirm new password</label>
          <input class="form-control" type="password" id="password_confirmation" name="password_confirmation"
                 placeholder="••••••••" autocomplete="new-password" required/>
        </div>

        <div id="formError" class="alert alert-danger" style="display:none;margin-bottom:1rem">
          <span>⛔</span><span id="formErrorMsg"></span>
        </div>

        <button type="submit" class="btn btn-primary btn-lg btn-block" id="submitBtn">
          Reset Password
        </button>
      </form>
    </div>

    <div id="doneState" style="display:none;text-align:center">
      <div style="font-size:2.5rem;margin-bottom:1rem">✅</div>
      <h1 class="auth-heading">Password updated</h1>
      <p class="auth-subtext">Your password has been reset. Please log in with your new password.</p>
      <a class="btn btn-primary btn-block" href="login.html">Go to sign in</a>
    </div>
  </div>
</div>

<script src="../js/api.js"></script>
<script src="../js/app.js"></script>
<script>
'use strict';

const recoveryToken = sessionStorage.getItem('rxguard_recovery_token');

if (!recoveryToken) {
  document.getElementById('formState').style.display = 'none';
  document.getElementById('noTokenState').style.display = 'block';
} else {
  document.getElementById('togglePwd').addEventListener('click', function () {
    const pwd = document.getElementById('password');
    const isText = pwd.type === 'text';
    pwd.type = isText ? 'password' : 'text';
    this.textContent = isText ? '👁' : '🙈';
  });

  document.getElementById('resetForm').addEventListener('submit', async function (e) {
    e.preventDefault();
    hideError();

    const password = document.getElementById('password').value;
    const confirm  = document.getElementById('password_confirmation').value;

    if (password.length < 8) { showError('Password must be at least 8 characters'); return; }
    if (password !== confirm) { showError('Passwords do not match'); return; }

    App.FormHelper.setLoading('submitBtn', true);
    try {
      await RxGuard.Auth.resetPassword(recoveryToken, password, confirm);
      sessionStorage.removeItem('rxguard_recovery_token');
      document.getElementById('formState').style.display = 'none';
      document.getElementById('doneState').style.display = 'block';
    } catch (err) {
      showError(err.message || 'Could not reset your password. The link may have expired.');
      App.FormHelper.setLoading('submitBtn', false, 'Reset Password');
    }
  });
}

function showError(msg) {
  document.getElementById('formError').style.display = 'flex';
  document.getElementById('formErrorMsg').textContent = msg;
}
function hideError() {
  document.getElementById('formError').style.display = 'none';
}
</script>
</body>
</html>
