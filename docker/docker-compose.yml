version: "3.9"

# =============================================================
# RxGuard — Docker Compose
# Services: frontend · nginx-proxy · backend (php-fpm) · redis · queue · scheduler
# Database: Supabase (managed PostgreSQL, external — no local DB container)
# =============================================================

x-backend-env: &backend-env
  APP_NAME:             RxGuard
  APP_ENV:              ${APP_ENV:-production}
  APP_KEY:              ${APP_KEY}
  APP_DEBUG:            ${APP_DEBUG:-false}
  APP_URL:              ${APP_URL:-http://localhost}
  APP_TIMEZONE:         Africa/Lagos

  # Supabase (managed PostgreSQL) — set these in your .env / shell env.
  # Get the values from Supabase: Project Settings -> Database.
  DB_CONNECTION:        pgsql
  DB_HOST:              ${DB_HOST:?set DB_HOST to your Supabase host, e.g. db.YOUR-PROJECT-REF.supabase.co}
  DB_PORT:              ${DB_PORT:-5432}
  DB_DATABASE:          ${DB_DATABASE:-postgres}
  DB_USERNAME:          ${DB_USERNAME:-postgres}
  DB_PASSWORD:          ${DB_PASSWORD}
  DB_SCHEMA:            ${DB_SCHEMA:-public}
  DB_SSLMODE:           ${DB_SSLMODE:-require}
  DB_EMULATE_PREPARES:  ${DB_EMULATE_PREPARES:-true}

  CACHE_DRIVER:         redis
  SESSION_DRIVER:       redis
  QUEUE_CONNECTION:     redis

  REDIS_HOST:           redis
  REDIS_PASSWORD:       ${REDIS_PASSWORD:-null}
  REDIS_PORT:           6379

  FILESYSTEM_DISK:      local

  GEMINI_API_KEY:       ${GEMINI_API_KEY}
  GEMINI_OCR_MODEL:     ${GEMINI_OCR_MODEL:-gemini-1.5-pro}
  GEMINI_CHAT_MODEL:    ${GEMINI_CHAT_MODEL:-gemini-1.5-flash}

  EMDEX_API_KEY:        ${EMDEX_API_KEY}
  EMDEX_BASE_URL:       ${EMDEX_BASE_URL:-https://api.emdex.ng/v1}

  OPENFDA_API_KEY:      ${OPENFDA_API_KEY}
  OPENFDA_BASE_URL:     ${OPENFDA_BASE_URL:-https://api.fda.gov}

  MAIL_MAILER:          ${MAIL_MAILER:-smtp}
  MAIL_HOST:            ${MAIL_HOST}
  MAIL_PORT:            ${MAIL_PORT:-587}
  MAIL_USERNAME:        ${MAIL_USERNAME}
  MAIL_PASSWORD:        ${MAIL_PASSWORD}
  MAIL_ENCRYPTION:      tls
  MAIL_FROM_ADDRESS:    noreply@rxguard.ng
  MAIL_FROM_NAME:       RxGuard

  LOG_CHANNEL:          stderr
  LOG_LEVEL:            ${LOG_LEVEL:-error}

services:

  # ── Frontend (Nginx serving static files) ──────────────────
  frontend:
    build:
      context:    ..
      dockerfile: docker/Dockerfile.frontend
    container_name: rxguard_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - nginx
    networks:
      - rxguard_network
    labels:
      com.rxguard.service: frontend

  # ── Nginx reverse proxy (routes API traffic to php-fpm) ────
  nginx:
    image: nginx:1.25-alpine
    container_name: rxguard_nginx
    restart: unless-stopped
    ports:
      - "${API_PORT:-8000}:80"
    volumes:
      - ./nginx/api.conf:/etc/nginx/conf.d/default.conf:ro
      - backend_storage:/var/www/html/storage:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - rxguard_network
    labels:
      com.rxguard.service: nginx

  # ── Laravel backend (PHP-FPM) ───────────────────────────────
  backend:
    build:
      context:    ..
      dockerfile: docker/Dockerfile.backend
    container_name: rxguard_backend
    restart: unless-stopped
    environment:
      <<: *backend-env
    volumes:
      - backend_storage:/var/www/html/storage
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - rxguard_network
    healthcheck:
      test: ["CMD", "php-fpm", "-t"]
      interval: 30s
      timeout:  10s
      retries:  3
      start_period: 30s
    labels:
      com.rxguard.service: backend

  # ── Queue worker (Laravel Horizon / queue:work) ────────────
  queue:
    build:
      context:    ..
      dockerfile: docker/Dockerfile.backend
    container_name: rxguard_queue
    restart: unless-stopped
    command: ["php", "artisan", "queue:work", "redis", "--sleep=3", "--tries=3", "--max-time=3600"]
    environment:
      <<: *backend-env
    volumes:
      - backend_storage:/var/www/html/storage
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - rxguard_network
    labels:
      com.rxguard.service: queue

  # ── Scheduler (Laravel schedule:run every minute) ──────────
  scheduler:
    build:
      context:    ..
      dockerfile: docker/Dockerfile.backend
    container_name: rxguard_scheduler
    restart: unless-stopped
    command: >
      sh -c "while true; do php artisan schedule:run --verbose --no-interaction & sleep 60; done"
    environment:
      <<: *backend-env
    volumes:
      - backend_storage:/var/www/html/storage
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - rxguard_network
    labels:
      com.rxguard.service: scheduler

  # No local database container: the app connects directly to your
  # Supabase Postgres instance over the network via DB_HOST/DB_PORT above.

  # ── Redis (sessions, cache, queues) ───────────────────────
  redis:
    image: redis:7.2-alpine
    container_name: rxguard_redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save 900 1
      --save 300 10
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_EXTERNAL_PORT:-6379}:6379"
    networks:
      - rxguard_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout:  5s
      retries:  5
      start_period: 10s
    labels:
      com.rxguard.service: redis

# ── Named volumes ─────────────────────────────────────────────
volumes:
  redis_data:
    driver: local
  backend_storage:
    driver: local

# ── Networks ──────────────────────────────────────────────────
networks:
  rxguard_network:
    driver: bridge
    name:   rxguard_network