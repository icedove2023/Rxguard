[PHP]
memory_limit          = 256M
upload_max_filesize   = 11M
post_max_size         = 11M
max_execution_time    = 120
max_input_time        = 120
expose_php            = Off
display_errors        = Off
log_errors            = On
error_log             = /proc/self/fd/2
date.timezone         = Africa/Lagos